name: AFAT Live Cloudflare Passenger Atlas Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/afat-cloudflare-passenger-release.yml'
      - 'scripts/verify-cloudflare-passenger-atlas.mjs'
      - 'dashboard/src/components/commuter/PassengerSpatialMap.tsx'
      - 'dashboard/src/services/routeGuidance.ts'
      - 'dashboard/src/services/canonicalRouteClient.ts'
      - 'dashboard/src/services/offlineJourneyRoute.ts'
      - 'dashboard/src/components/commuter/PassagePlanner.tsx'
      - 'dashboard/src/components/commuter/PaymentSheet.tsx'
      - 'dashboard/src/components/commuter/PassengerScheduledSeatJourney.tsx'
      - 'dashboard/src/services/paymentRecovery.ts'
      - 'dashboard/src/components/commuter/FieldEvidenceCapture.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-cloudflare-release:
    name: Confirm deployed Cloudflare passenger Atlas experience
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect published JS rather than trusting local build
        env:
          AFAT_FRONTEND_URL: https://asteck-bot.pages.dev
        run: |
          for attempt in $(seq 1 15); do
            if node scripts/verify-cloudflare-passenger-atlas.mjs; then exit 0; fi
            echo "Cloudflare has not yet served the new offline passenger release (attempt $attempt/15)"
            sleep 20
          done
          exit 1
