name: AFAT Cameroon Real OSRM Graph Acceptance

# Runs only on this routing integration PR or by explicit dispatch.
# Public GitHub runner: no Render service, paid provider, or production data writes.
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/afat-cameroon-real-osrm-acceptance.yml'
      - 'routing/cameroon/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/afat-cameroon-real-osrm-acceptance.yml'
      - 'routing/cameroon/Dockerfile.prebuilt'
      - 'routing/cameroon/.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: afat-cameroon-osrm-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-real-city-routes:
    name: Real Cameroon OSM → OSRM → two-city route geometry
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bounded runner capacity
        shell: bash
        run: |
          set -euo pipefail
          docker version
          df -h .
          free -h
          echo 'AFAT processes real OSM/ODbL evidence; no private user data or test database writes.'
      - name: Prepare checksum-verified Cameroon graph
        shell: bash
        run: bash routing/cameroon/prepare.sh
      - name: Boot isolated local OSRM
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name afat-cameroon-osrm-acceptance -p 127.0.0.1:5000:5000 \
            -v "$PWD/routing/cameroon/data:/data:ro" \
            ghcr.io/project-osrm/osrm-backend:v5.27.1 \
            osrm-routed --algorithm mld --ip 0.0.0.0 --port 5000 /data/cameroon-latest.osrm
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 'http://127.0.0.1:5000/nearest/v1/driving/11.516,3.866?number=1' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs afat-cameroon-osrm-acceptance || true
            echo 'Actual Cameroon OSRM instance failed readiness; stop acceptance.'
            exit 1
          fi
      - name: Assert real Yaounde and Douala routes
        env:
          AFAT_OSRM_SMOKE_URL: http://127.0.0.1:5000
        run: node routing/cameroon/verify.mjs
      - name: Record auditable source and engine proof
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            cat routing/cameroon/data/graph-provenance.txt
            echo "source_sha256=$(sha256sum routing/cameroon/data/cameroon-latest.osm.pbf | cut -d' ' -f1)"
            test -s routing/cameroon/data/cameroon-latest.osrm.partition
            test -s routing/cameroon/data/cameroon-latest.osrm.cells
            echo "graph_partition_sha256=$(sha256sum routing/cameroon/data/cameroon-latest.osrm.partition | awk '{print $1}')"
            echo "graph_cells_sha256=$(sha256sum routing/cameroon/data/cameroon-latest.osrm.cells | awk '{print $1}')"
            echo "osm_bytes=$(stat -c%s routing/cameroon/data/cameroon-latest.osm.pbf)"
            echo "graph_partition_bytes=$(stat -c%s routing/cameroon/data/cameroon-latest.osrm.partition)"
            echo "graph_cells_bytes=$(stat -c%s routing/cameroon/data/cameroon-latest.osrm.cells)"
            echo "route_smoke=Yaounde_and_Douala_passed"
            echo "acceptance_limit=temporary_runner_no_field_validation_or_live_service"
          } > routing/cameroon/data/acceptance-proof.txt
          {
            echo '### AFAT real Cameroon routing preparation'
            echo 'Checksum-verified Geofabrik OSM → OSRM MLD graph → real local server → Yaoundé/Douala route geometry: **PASS**.'
            echo 'No paid service deployed, no Cameroon field passability proven, no persistent routing endpoint created.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build deployment-ready image using the accepted country graph
        shell: bash
        run: |
          set -euo pipefail
          # BuildKit can lose sparse mmap file length during layer export.
          # Materialize this verified graph index fully before COPY, then require
          # source and image checksums to match. No live/prod graph is modified.
          INDEX=routing/cameroon/data/cameroon-latest.osrm.fileIndex
          # OSRM preprocessing runs in a root container and may create this
          # public OSM-derived mmap index with mode 0600. BuildKit's unprivileged
          # context reader cannot copy it; fix only ephemeral graph file access.
          sudo chmod a+r "$INDEX"
          stat -c 'graph_index_mode=%a graph_index_bytes=%s' "$INDEX"
          test -r "$INDEX" && test -s "$INDEX"
          cp --sparse=never "$INDEX" "${INDEX}.dense"
          test "$(stat -c%s "$INDEX")" = "$(stat -c%s "${INDEX}.dense")"
          cmp -s "$INDEX" "${INDEX}.dense"
          mv -f "${INDEX}.dense" "$INDEX"
          docker build --file routing/cameroon/Dockerfile.prebuilt \
            --tag afat-cameroon-osrm:acceptance routing/cameroon
          echo 'Host MLD graph artifacts'
          find routing/cameroon/data -maxdepth 1 -name 'cameroon-latest.osrm.*' -printf '%f %s bytes\\n' | sort | head -35
          echo 'Prebuilt image MLD graph artifacts'
          docker run --rm --entrypoint /bin/sh afat-cameroon-osrm:acceptance -c \
            "find /data -maxdepth 1 -name 'cameroon-latest.osrm.*' -printf '%f %s bytes\\n' | sort | head -35"
          docker run -d --name afat-osrm-prebuilt-smoke -p 127.0.0.1:5001:5000 \
            afat-cameroon-osrm:acceptance
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' afat-osrm-prebuilt-smoke)" != true ]; then
            docker logs afat-osrm-prebuilt-smoke
            echo 'Prebuilt Cameroon engine terminated before readiness' >&2
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 35); do
            if curl -fsS --max-time 3 'http://127.0.0.1:5001/nearest/v1/driving/11.516,3.866?number=1' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs afat-osrm-prebuilt-smoke || true
            echo 'Packaged routing image did not start.' >&2
            exit 1
          fi
          AFAT_OSRM_SMOKE_URL=http://127.0.0.1:5001 node routing/cameroon/verify.mjs
          docker rm -f afat-osrm-prebuilt-smoke
      - name: Publish immutable OCI runtime image only from validated master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          TAG="ghcr.io/lasana10/afat-cameroon-osrm:sha-${GITHUB_SHA:0:12}"
          docker tag afat-cameroon-osrm:acceptance "$TAG"
          docker push "$TAG"
          echo "Published immutable Cameroon routing runtime: $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload small provenance evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: afat-cameroon-osrm-provenance
          path: routing/cameroon/data/acceptance-proof.txt
          if-no-files-found: error
          retention-days: 14
      - name: On failure, show isolated engine diagnostics
        if: failure()
        shell: bash
        run: |
          docker logs --tail 150 afat-cameroon-osrm-acceptance || true
          docker logs --tail 150 afat-osrm-prebuilt-smoke || true
      - name: Remove ephemeral route engine
        if: always()
        shell: bash
        run: |
          docker rm -f afat-cameroon-osrm-acceptance || true
          docker rm -f afat-osrm-prebuilt-smoke || true
