name: DREEM frontend

on:
  pull_request:
    paths:
      - "schoolflow/**"
      - ".github/workflows/dreem-frontend.yml"
  push:
    branches: [master]
    paths:
      - "schoolflow/**"
      - ".github/workflows/dreem-frontend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schoolflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schoolflow/package-lock.json
      - run: npm ci
      - run: npm run check
