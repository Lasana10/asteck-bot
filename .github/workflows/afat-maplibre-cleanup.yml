name: AFAT MapLibre cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Remove retired Leaflet dependencies
        working-directory: dashboard
        run: npm uninstall react-leaflet leaflet leaflet.heat @types/leaflet @types/leaflet.heat
      - name: Remove retired Leaflet stylesheet import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/src/main.tsx')
          text = p.read_text()
          text = text.replace("import 'leaflet/dist/leaflet.css';\n", '')
          p.write_text(text)
          PY
      - name: Verify no runtime Leaflet references remain
        run: |
          if grep -RInE "react-leaflet|leaflet/dist|from ['\"]leaflet['\"]|leaflet\.heat" dashboard/src dashboard/package.json; then
            echo "Leaflet references remain; refusing cleanup commit."
            exit 1
          fi
      - name: Build and test dashboard
        working-directory: dashboard
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_key
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAATESTKEY
          VITE_API_URL: https://asteck-bot.onrender.com
        run: |
          npm run build
          npm test -- --passWithNoTests
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package.json dashboard/package-lock.json dashboard/src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "chore(atlas): retire Leaflet after MapLibre migration"
          git push origin HEAD:master
