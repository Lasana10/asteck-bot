name: AFAT CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - run: npm run test:api-contract

  dashboard:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm run test:env:missing
      - working-directory: dashboard
        run: npm run test:env:complete
      - working-directory: dashboard
        run: npm run test:env:cf-no-api
      - working-directory: dashboard
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_key
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAATESTKEY
          VITE_API_URL: https://asteck-bot.onrender.com
        run: npm run build
      - working-directory: dashboard
        run: npm test -- --passWithNoTests
