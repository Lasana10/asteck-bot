name: AFAT CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - run: npm run test:atlas-ai-evidence
      - run: npm run test:atlas-source-understanding
      - run: npm run test:api-contract
      - run: npm run test:reachability:reviewed-access
      - run: npm run test:transit-review-authority
      - run: npm run test:published-departures
      - run: npm run test:map-signal-fleet
      - run: npm run test:fleet-position-freshness
      - run: npm run test:scheduled-departures
      - run: npm run test:operator-departure-operations
      - run: npm run test:operator-vehicle-registration
      - run: npm run test:place-candidate-contract
      - run: npm run test:private-visual-evidence
      - run: npm run test:routing
      - run: bash -n routing/cameroon/prepare.sh
      - run: node --check routing/cameroon/verify.mjs
      - run: docker compose -f routing/cameroon/docker-compose.yml config --quiet

  dashboard:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm run test:env:missing
      - working-directory: dashboard
        run: npm run test:env:complete
      - working-directory: dashboard
        run: npm run test:env:cf-no-api
      - working-directory: dashboard
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_key
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAATESTKEY
          VITE_API_URL: https://asteck-bot.onrender.com
        run: npm run build
      - run: npm ci
      - working-directory: dashboard
        run: npm test -- --passWithNoTests
