name: AFAT Yaounde Google Open Buildings

on:
  push:
    branches:
      - feat/afat-multisource-atlas
    paths:
      - '.github/workflows/afat-yaounde-google-open-buildings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-google-buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Overture client
        run: python -m pip install 'overturemaps==1.0.2'
      - name: Extract Google Open Buildings upstream records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/afat-google-open-buildings
          BBOX='11.4905,3.8373,11.5080,3.8527'
          overturemaps download --bbox="$BBOX" -f geojson --type=building -o artifacts/afat-google-open-buildings/overture-buildings.geojson
          python - <<'PY'
          import hashlib, json, pathlib
          src=pathlib.Path('artifacts/afat-google-open-buildings/overture-buildings.geojson')
          data=json.loads(src.read_text(encoding='utf-8'))
          records=[]
          upstream_counts={}
          for feature in data.get('features',[]):
              props=feature.get('properties') or {}
              sources=props.get('sources') or []
              upstream=(sources[0].get('dataset') if sources else None) or 'unknown'
              upstream_counts[upstream]=upstream_counts.get(upstream,0)+1
              if upstream!='Google Open Buildings':
                  continue
              fid=feature.get('id')
              geom=feature.get('geometry')
              fp=hashlib.sha256(json.dumps({'id':fid,'geometry':geom,'properties':props},sort_keys=True,separators=(',',':')).encode()).hexdigest()
              records.append({
                  'external_feature_id': f'google-open-buildings/{fid}',
                  'dataset_version':'v3-via-overture-2026-08-19.0',
                  'canonical_name':f'Google Open Building {fid[:8]}',
                  'normalized_name':f'google open building {fid[:8]}',
                  'alternate_names':[],
                  'source_category':'building_footprint',
                  'source_address':None,
                  'source_confidence':0.60,
                  'source_properties':{
                      'overture_feature_id':fid,
                      'overture_release':'2026-08-19.0',
                      'overture_properties':props,
                      'upstream_dataset':'Google Open Buildings',
                      'distribution_only':'Overture Maps Foundation'
                  },
                  'record_fingerprint':fp,
                  'source_feature_kind':'polygon',
                  'geometry':geom,
                  'source_license':'CC-BY-4.0',
                  'attribution_text':'Google Research Open Buildings; distributed via Overture Maps Foundation'
              })
          records.sort(key=lambda x:x['external_feature_id'])
          manifest={
              'pilot':'AFAT Yaounde Google Open Buildings evidence',
              'bbox':[11.4905,3.8373,11.5080,3.8527],
              'source':'Google Research Open Buildings',
              'dataset_version':'v3',
              'distribution':'Overture Maps Foundation 2026-08-19.0',
              'selected_license':'CC-BY-4.0',
              'record_count':len(records),
              'overture_upstream_counts':upstream_counts,
              'trust_rule':'Distribution through Overture does not change upstream source identity. Google ML footprints remain candidate geometry evidence only.'
          }
          if len(records) < 1:
              raise SystemExit('No Google Open Buildings records found in Overture pilot extract')
          out=pathlib.Path('data/afat-pilot/google-open-buildings/yaounde-v3-via-overture-2026-08-19-candidates.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'manifest':manifest,'records':records},separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'manifest':manifest,'snapshot_bytes':out.stat().st_size},indent=2))
          PY
      - name: Publish auditable Google building snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/afat-pilot/google-open-buildings/yaounde-v3-via-overture-2026-08-19-candidates.json
          if git diff --cached --quiet; then
            echo 'Google building snapshot unchanged.'
          else
            git commit -m 'data(afat): snapshot Yaounde Google Open Buildings candidates'
            git fetch origin feat/afat-multisource-atlas
            git rebase origin/feat/afat-multisource-atlas
            git push origin HEAD:feat/afat-multisource-atlas
          fi
