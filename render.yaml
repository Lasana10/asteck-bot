services:
  - type: redis
    name: sentinel-redis
    plan: free
    ipAllowList: [] # Only allow internal access

  - type: web
    name: asteck-bot
    env: docker
    plan: starter
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health/contract
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: FRONTEND_URL
        value: https://asteck-bot.pages.dev
      - key: CLOUDFLARE_PREVIEW_URL
        value: https://8dab4729.asteck-bot.pages.dev
      - key: ADMIN_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AFAT_OPERATOR_INVITE_EMAILS
        sync: false
      - key: AFAT_OPERATOR_INVITE_CODE
        sync: false
      - key: AFAT_PLANNER_INVITE_EMAILS
        sync: false
      - key: AFAT_PLANNER_INVITE_CODE
        sync: false
      - key: AFAT_ADMIN_BOOTSTRAP_EMAILS
        sync: false
      - key: AFAT_ADMIN_BOOTSTRAP_CODE
        sync: false
      - key: PAYMENT_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: pawapay
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: REDIS_URL
        fromService:
          name: sentinel-redis
          type: redis
          property: connectionString

  - type: static_site
    name: sentinel-dashboard
    plan: free
    rootDir: dashboard
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
