version: '3.8'

services:
  # ==========================================
  # 1. CORE BACKEND (CityBrain Engine + PM2)
  # ==========================================
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # 2. FRONTEND DASHBOARD (Nginx SPA Server)
  # ==========================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sentinel_dashboard
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# Note: Database is Serverless via Supabase (managed).
# To self-host, add a PostGIS container here.
